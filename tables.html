<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table,
        tr,
        td,
        th {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>

    <div>
        <h1>Tables</h1>
        <table>
            <tr>
                <td>1</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
            </tr>
        </table>

        <h2>Students score</h2>
        <table>

            <thead>

                <tr>
                    <th>Subject/Score</th>
                    <th>Maths</th>
                    <th>Hindi</th>
                    <th>English</th>
                    <th>Science</th>
                </tr>

            </thead>

            <tbody>
                <tr>
                    <td>Sahil</td>
                    <td>78</td>
                    <td>74</td>
                    <td>71</td>
                    <td>76</td>
                </tr>

                <tr>
                    <td>Aditya</td>
                    <td>77</td>
                    <td>78</td>
                    <td>79</td>
                    <td>74</td>
                </tr>

                <tr>
                    <td>Harsh</td>
                    <td>77</td>
                    <td>78</td>
                    <td>74</td>
                    <td>79</td>
                </tr>

                <tr>
                    <td>Arjun</td>
                    <td>69</td>
                    <td>72</td>
                    <td>76</td>
                    <td>71</td>
                </tr>

            <tfoot>
                <th>Total</th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
            </tfoot>
            </tbody>
            <caption>Students score</caption>
        </table>

        <h2>Rowspan and colspan</h2>
        <table>
            <tr>
                <td rowspan="2"></td>
                <th colspan="2" style="text-align: center;">Average</th>

                <th rowspan="2">Red Eyes</th>
            </tr>

            <tr>

                <th>Height</th>
                <th>Weight</th>

            </tr>

            <tr>
                <td>Males</td>
                <td>1.9</td>
                <td>0.0003</td>
                <td>40%</td>
            </tr>

            <tr>
                <td>Females</td>
                <td>1.7</td>
                <td>0.0002</td>
                <td>43%</td>
            </tr>
            <caption> A test table with merge cell</caption>
        </table>

    </div>

</body>

</html>
