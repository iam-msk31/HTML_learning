<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    
</head>
<body>
    <h2>Forms</h2>
    <div >
        <form action="" style="background-color: rgb(252, 67, 67);">
            <fieldset style=" background-color:rgba(198, 247, 240, 0.967)">
            <label for="Fullname" >Full name :</label>
            <input type="text" id ="Fullname" placeholder=" Enter your name">

            <br><br>

            <label for="Email">Enter email</label>
        <input type="email" id="Email" placeholder = 'Enter your email id'>

        <br> <br>

        <label for="password">Enter your password</label>
         <input type="password" id = password placeholder = "Enter your password">

         <br><br>

         <label for="checkbox">Are you 18+</label>
         <input type="checkbox" id="checkbox">
         <br><br>

         <label for="income">Enter your income</label>
         <input type="number" id="income">
        
         <br><br>

         <label for="gender">Gender :</label>
         <label for="gender">male</label>
         <input type="radio" id="gender" name="gender">
         <label for="gender">female</label>
         <input type="radio" id="gender" name="gender">

         <br><br>
         <label for="date">Enter your DOB</label>
         <input type="date" id="date">

         <br><br>

         <label for="file">Upload file</label>
         <input type="file" id="file">

         
          
         <br><br>
         <label for="city">Select your city : </label>
         <select name="city" id="city">
        <option value="">Banglore</option>
        <option value="">Noida</option>
        <option value="">Patna</option>
        <option value="">Delhi</option>
        <option value="">Mumbai</option>
        </select>

        <br><br>
         <button type="submit">Submit</button>

        <br><br>
        </fieldset>

        </form>
    </div>
</body>
</html>
